name: BurnoutMeter CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # 1. Environment Setup
      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.0'
          cache: true

      - name: Setup Node.js (for Firebase Emulators & Rules Tests)
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 2. Dependencies & Generation
      - name: Install Dependencies
        run: flutter pub get

      - name: Run Build Runner
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # 3. Static Analysis
      - name: Run Lints Analyzer
        run: flutter analyze

      # 4. Security Rules Validation
      - name: Install Firestore Tests Dependencies
        run: cd firestore-tests && npm ci

      - name: Run Firestore Security Rules Tests
        run: firebase emulators:exec --project demo-burnoutmeter "cd firestore-tests && npm test"

      # 5. Unit & Widget Tests
      - name: Run Standard Tests
        run: flutter test

      # 6. Install Functions Dependencies (needed for emulator)
      - name: Install Functions Dependencies
        run: cd functions && npm install

      # 7. E2E Web Integration Tests (against Emulators)
      - name: Setup ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Run Web E2E Integration Tests
        run: |
          export DISPLAY=:99
          sudo Xvfb -ac :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &
          chromedriver --port=4444 &
          firebase emulators:exec --project demo-burnoutmeter "flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart -d web-server --dart-define=USE_EMULATOR=true"
          
      # 8. Production Build Verification
      - name: Build Web Target
        run: flutter build web --release

      # 9. Staging Deployment (Optional/Placeholder)
      - name: Deploy to Firebase Hosting (Staging)
        if: github.ref == 'refs/heads/main'
        run: echo "Deployment to Firebase Hosting would occur here using firebase deploy --only hosting"

